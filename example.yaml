esphome:
  name: litewave-switch

esp32:
  variant: ESP32C6
  board: esp32-c6-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Litewave — raw 802.15.4 TX for Nanoleaf control
#
# Setup workflow:
#   1. Pick a shared secret from token_catalog.yaml (or generate your own)
#   2. Fill in the group config below with the catalog tokens
#   3. Flash this config to your ESP32-C6
#   4. Use the litewave.provision_light action from HA to push the secret
#      to each light (or use tools/provision_v3.py manually)
#
# Sniff mode: set sniff: true to capture tokens from a Sense+ switch.
# This is only needed if you're generating your own secrets instead of
# using the pre-generated catalog.
litewave:
  channel: 26
  pan_id: 0x3B71
  sniff: false

  groups:
    - id: living_room
      shared_secret: "0x01"  # auto-padded to 54 bytes (or full 108 hex chars)
      on_sequence: 0xFB
      on_token: "949B16B63E32024A9DD73E03604D"
      off_sequence: 0xFD
      off_token: "9ACC50F8E109757695C384C4EA74"
      # dim_plus_sequence: 0x03
      # dim_plus_token: "..."
      # dim_minus_sequence: 0x05
      # dim_minus_token: "..."
      lights:
        - name: "Living Room DL 1"
          host: "192.168.1.50"
          pairing_code: "1640-700-5590"

# Physical button
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      mode:
        pullup: true
        input: true
      inverted: true
    name: "Button 1"
    on_press:
      - light.toggle: user_led_1

# LED output
output:
  - platform: gpio
    pin:
      number: GPIO15
      inverted: true
    id: button_led_pin_1

# Binary light — LED state drives Litewave commands
light:
  - platform: binary
    name: "Living Room Lights"
    output: button_led_pin_1
    id: user_led_1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - litewave.send_on:
          group: living_room
    on_turn_off:
      - litewave.send_off:
          group: living_room

# Provision a light from Home Assistant (push shared secret to the light)
# Call esphome.litewave_switch_provision_living_room_0 from HA
button:
  - platform: template
    name: "Provision Living Room DL 1"
    on_press:
      - litewave.provision_light:
          group: living_room
          light_index: 0
